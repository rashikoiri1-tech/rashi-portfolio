<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <radialGradient id="rg6" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="#0b0f19" />
  <rect width="800" height="500" rx="16" fill="url(#rg6)" />

  <!-- Code / Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Browser/Window Mockup Frame -->
  <rect x="70" y="70" width="660" height="360" rx="12" fill="#111827" stroke="#1f2937" stroke-width="2" />
  <!-- Title bar -->
  <rect x="70" y="70" width="660" height="40" rx="12" fill="#1e293b" />
  <circle cx="100" cy="90" r="5" fill="#ef4444" />
  <circle cx="118" cy="90" r="5" fill="#f59e0b" />
  <circle cx="136" cy="90" r="5" fill="#10b981" />
  <rect x="250" y="80" width="300" height="20" rx="6" fill="#0f172a" />

  <!-- Center Artwork -->
  <rect x="120" y="140" width="560" height="180" rx="8" fill="url(#g6)" fill-opacity="0.1" stroke="url(#g6)" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Hologram Node / Chart -->
  <circle cx="400" cy="220" r="45" fill="none" stroke="url(#g6)" stroke-width="3" />
  <circle cx="400" cy="220" r="25" fill="url(#g6)" opacity="0.3" />
  <circle cx="330" cy="220" r="14" fill="#ec4899" opacity="0.8" />
  <circle cx="470" cy="220" r="14" fill="#f43f5e" opacity="0.8" />
  <line x1="344" y1="220" x2="355" y2="220" stroke="url(#g6)" stroke-width="2" />
  <line x1="445" y1="220" x2="456" y2="220" stroke="url(#g6)" stroke-width="2" />

  <!-- Text badges -->
  <rect x="120" y="345" width="160" height="28" rx="6" fill="url(#g6)" opacity="0.2" />
  <text x="130" y="364" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">MONITORING & TS</text>
  <text x="120" y="405" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">PulseOps Observability Suite</text>
</svg>