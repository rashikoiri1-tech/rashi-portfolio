<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>
  <!-- Background Glow Orb -->
  <circle cx="400" cy="225" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <!-- Dashboard Card Window -->
  <rect x="180" y="80" width="440" height="280" rx="16" fill="#0b1329" stroke="rgba(6,182,212,0.4)" stroke-width="2" />
  <!-- Window Header -->
  <rect x="180" y="80" width="440" height="40" rx="16" fill="#0f1f3d" />
  <circle cx="205" cy="100" r="5" fill="#f43f5e" />
  <circle cx="225" cy="100" r="5" fill="#eab308" />
  <circle cx="245" cy="100" r="5" fill="#10b981" />
  <text x="270" y="105" fill="#94a3b8" font-family="monospace" font-size="12">hrms-portal / dashboard / employees</text>
  <!-- Data metrics & rows -->
  <rect x="210" y="145" width="110" height="48" rx="8" fill="#172554" stroke="rgba(59,130,246,0.3)" />
  <text x="225" y="168" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">1,248</text>
  <text x="225" y="184" fill="#64748b" font-family="sans-serif" font-size="10">Active Employees</text>
  <rect x="345" y="145" width="110" height="48" rx="8" fill="#064e3b" stroke="rgba(16,185,129,0.3)" />
  <text x="360" y="168" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="16">99.4%</text>
  <text x="360" y="184" fill="#64748b" font-family="sans-serif" font-size="10">Attendance Sync</text>
  <rect x="480" y="145" width="110" height="48" rx="8" fill="#3b0764" stroke="rgba(168,85,247,0.3)" />
  <text x="495" y="168" fill="#c084fc" font-family="sans-serif" font-weight="bold" font-size="16">REST API</text>
  <text x="495" y="184" fill="#64748b" font-family="sans-serif" font-size="10">MySQL Engine</text>
  <!-- Table Mock -->
  <rect x="210" y="215" width="380" height="24" rx="4" fill="#1e293b" />
  <text x="225" y="231" fill="#cbd5e1" font-family="monospace" font-size="11">ID   NAME             ROLE             STATUS</text>
  <rect x="210" y="247" width="380" height="20" rx="4" fill="#0f172a" />
  <text x="225" y="261" fill="#94a3b8" font-family="monospace" font-size="10">#101 Priya Sharma    Frontend Dev     [ACTIVE]</text>
  <rect x="210" y="273" width="380" height="20" rx="4" fill="#0f172a" />
  <text x="225" y="287" fill="#94a3b8" font-family="monospace" font-size="10">#102 Rahul Verma     ML Engineer      [ACTIVE]</text>
  <rect x="210" y="299" width="380" height="20" rx="4" fill="#0f172a" />
  <text x="225" y="313" fill="#94a3b8" font-family="monospace" font-size="10">#103 Ananya Sen      Database Admin   [ACTIVE]</text>
  <!-- Center Tag -->
  <text x="400" y="405" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14" letter-spacing="1">FULL-STACK HUMAN RESOURCE MANAGEMENT SYSTEM</text>
</svg>
