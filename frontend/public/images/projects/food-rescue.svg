<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061214" />
      <stop offset="100%" stop-color="#0d2324" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)" />
  <circle cx="400" cy="225" r="150" fill="#10b981" opacity="0.1" filter="url(#glow4)" />
  <!-- UI Window -->
  <rect x="150" y="70" width="500" height="300" rx="16" fill="#081a18" stroke="rgba(16,185,129,0.4)" stroke-width="2" />
  <rect x="150" y="70" width="500" height="40" rx="16" fill="#0d2825" />
  <circle cx="175" cy="90" r="5" fill="#f43f5e" />
  <circle cx="195" cy="90" r="5" fill="#eab308" />
  <circle cx="215" cy="90" r="5" fill="#10b981" />
  <text x="240" y="95" fill="#6ee7b7" font-family="monospace" font-size="12">food-rescue-network / redistribution-core</text>
  <!-- Node mapping -->
  <rect x="180" y="130" width="130" height="90" rx="8" fill="#0b2e29" stroke="rgba(16,185,129,0.3)" />
  <text x="195" y="155" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12">Surplus Donors</text>
  <text x="195" y="175" fill="#a7f3d0" font-family="sans-serif" font-size="10">Cafeterias &amp; Events</text>
  <text x="195" y="195" fill="#e2e8f0" font-family="monospace" font-size="11">● 14 Active Batches</text>
  <line x1="310" y1="175" x2="360" y2="175" stroke="#10b981" stroke-dasharray="4 2" stroke-width="2" />
  <rect x="360" y="140" width="80" height="70" rx="8" fill="#134e4a" />
  <text x="375" y="170" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">MATCH</text>
  <text x="370" y="188" fill="#a7f3d0" font-family="monospace" font-size="9">AI Router</text>
  <line x1="440" y1="175" x2="490" y2="175" stroke="#10b981" stroke-dasharray="4 2" stroke-width="2" />
  <rect x="490" y="130" width="130" height="90" rx="8" fill="#0b2e29" stroke="rgba(16,185,129,0.3)" />
  <text x="505" y="155" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12">Community NGOs</text>
  <text x="505" y="175" fill="#a7f3d0" font-family="sans-serif" font-size="10">Shelters &amp; Homes</text>
  <text x="505" y="195" fill="#e2e8f0" font-family="monospace" font-size="11">● Immediate Need</text>
  <!-- Mission Statement -->
  <rect x="180" y="240" width="440" height="105" rx="8" fill="#0b2321" stroke="rgba(255,255,255,0.06)" />
  <text x="200" y="270" fill="#6ee7b7" font-family="sans-serif" font-weight="bold" font-size="13">Zero Food Waste Logistics &amp; Real-Time Allocation</text>
  <text x="200" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="11">Connecting food providers directly with verified NGOs, orphanages, and community kitchens.</text>
  <text x="200" y="322" fill="#94a3b8" font-family="monospace" font-size="10">Built with Node.js, Express, MySQL spatial coordinates and geolocation</text>
  <text x="400" y="415" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="14" letter-spacing="1">FOOD RESCUE &amp; REDISTRIBUTION PLATFORM</text>
</svg>
