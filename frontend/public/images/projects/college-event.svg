  <rect x="410" y="130" width="200" height="95" rx="8" fill="#172554" stroke="rgba(59,130,246,0.4)" />
  <text x="425" y="155" fill="#60a5fa" font-family="sans-serif" font-weight="bold" font-size="14">Hackathon 2026</text>
  <text x="425" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="11">Track: Web &amp; Intelligent Apps</text>
  <text x="425" y="195" fill="#38bdf8" font-family="monospace" font-size="11">● 58 Teams Competing</text>
