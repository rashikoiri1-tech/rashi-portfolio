<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="purple-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)" />
  <circle cx="400" cy="225" r="150" fill="#8b5cf6" opacity="0.12" filter="url(#glow2)" />
  <!-- UI Card -->
  <rect x="160" y="70" width="480" height="300" rx="16" fill="#0d1424" stroke="rgba(139,92,246,0.4)" stroke-width="2" />
  <rect x="160" y="70" width="480" height="40" rx="16" fill="#131e36" />
  <circle cx="185" cy="90" r="5" fill="#f43f5e" />
  <circle cx="205" cy="90" r="5" fill="#eab308" />
  <circle cx="225" cy="90" r="5" fill="#10b981" />
  <text x="250" y="95" fill="#94a3b8" font-family="monospace" font-size="12">adamas-univ / events / registration-engine</text>
