  <line x1="244" y1="185" x2="278" y2="210" stroke="rgba(168,85,247,0.6)" stroke-width="1.5" />
  <line x1="302" y1="160" x2="348" y2="150" stroke="rgba(56,189,248,0.6)" stroke-width="1.5" />
