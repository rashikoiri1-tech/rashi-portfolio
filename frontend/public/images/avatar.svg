<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />
  
  <!-- Tech Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-dasharray="12 8" opacity="0.6" />
  <circle cx="200" cy="200" r="172" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.3" />

  <!-- Holographic Portrait Silhouette / Cyber Developer Avatar -->
  <g filter="url(#glow)">
    <!-- Shoulders -->
    <path d="M 100 360 C 110 270, 150 250, 200 250 C 250 250, 290 270, 300 360 Z" fill="url(#glowGrad)" opacity="0.85" />
    
    <!-- Neck -->
    <path d="M 180 220 L 220 220 L 220 260 L 180 260 Z" fill="#3b82f6" opacity="0.7" />
    
    <!-- Head / Face contour -->
    <ellipse cx="200" cy="175" rx="55" ry="70" fill="#0f172a" stroke="url(#glowGrad)" stroke-width="3" />
    
    <!-- Cyber Visor / Glasses -->
    <path d="M 155 160 Q 200 155 245 160 L 240 178 Q 200 185 160 178 Z" fill="#06b6d4" opacity="0.9" />
    <line x1="165" y1="169" x2="235" y2="169" stroke="#ffffff" stroke-width="2" opacity="0.8" />

    <!-- Headset / Cyber Nodes -->
    <rect x="135" y="155" width="12" height="35" rx="4" fill="#8b5cf6" />
    <rect x="253" y="155" width="12" height="35" rx="4" fill="#8b5cf6" />
    <circle cx="141" cy="172" r="3" fill="#06b6d4" />
    <circle cx="259" cy="172" r="3" fill="#06b6d4" />

    <!-- Subtle Hair / Cap structure -->
    <path d="M 148 140 C 155 105, 245 105, 252 140 C 235 125, 165 125, 148 140 Z" fill="url(#glowGrad)" />
  </g>

  <!-- Accent Status Light -->
  <circle cx="310" cy="90" r="8" fill="#10b981" filter="url(#glow)" />
  <circle cx="310" cy="90" r="4" fill="#ffffff" />
</svg>
